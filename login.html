<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Sc-SansChat - Login</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#111b21" />
  <link rel="stylesheet" href="./single-frame.css" />
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0b141a;
      color: #e9edef;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      margin: auto;
      padding: 20px;
      background: #111b21;
      border: 1px solid #222e35;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 13px;
      color: #aebac1;
      font-weight: 600;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid #2a3942;
      background: #202c33;
      color: #e9edef;
      font-size: 14px;
    }
    .pw-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pw-wrap input {
      flex: 1 1 auto;
      min-width: 0;
    }
    .btn-toggle {
      flex: 0 0 auto;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid #2a3942;
      background: #202c33;
      color: #e9edef;
      cursor: pointer;
    }
    .btn-login {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: none;
      background: #00a884;
      color: #061310;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      margin-top: 4px;
    }
    #statusMsg {
      font-size: 13px;
      min-height: 18px;
      color: #f15c6d;
    }
  </style>
</head>
<body>
  <div class="sf-viewport-frame">
    <div class="sf-scroll-body" style="display:flex; padding: 12px;">
      <form id="loginForm" class="login-card" autocomplete="on">
        <h1 style="margin:0; font-size:20px; text-align:center;">Login Sc-SansChat</h1>
        <div class="field-group">
          <label for="usernameInput">Username Warga</label>
          <input id="usernameInput" name="username" type="text" placeholder="Contoh: ADMINPUSAT" required />
        </div>
        <div class="field-group">
          <label for="passwordInput">Password</label>
          <div class="pw-wrap">
            <input id="passwordInput" name="password" type="password" placeholder="Masukkan password" required />
            <button type="button" id="togglePwBtn" class="btn-toggle" aria-label="Tampilkan atau sembunyikan password">👁️</button>
          </div>
        </div>
        <div id="statusMsg" role="status" aria-live="polite"></div>
        <button type="submit" id="loginSubmitBtn" class="btn-login">Masuk Sekarang</button>
        <a href="./utama.html" style="text-align:center; font-size:12px; color:#53bdeb; text-decoration:none;">Lanjut ke Halaman Utama</a>
      </form>
    </div>
  </div>
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyHBqAVQ044nhszVhbKIeP2qi6Wwafu5KgfU648L6RNQSBwYPd_DXWm-TOqUwO7KVg/exec";
    const pwInput = document.getElementById("passwordInput");
    const toggleBtn = document.getElementById("togglePwBtn");
    const statusEl = document.getElementById("statusMsg");

    toggleBtn.addEventListener("click", () => {
      const isPw = pwInput.type === "password";
      pwInput.type = isPw ? "text" : "password";
      toggleBtn.textContent = isPw ? "🙈" : "👁️";
    });

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const u = document.getElementById("usernameInput").value.trim().toUpperCase();
      const p = pwInput.value.trim();
      if (!u || !p) {
        statusEl.textContent = "Username dan password wajib diisi.";
        return;
      }
      statusEl.style.color = "#8696a0";
      statusEl.textContent = "Memverifikasi akun...";
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "loginUser", username: u, password: p })
        });
        const json = await res.json();
        const data = json && json.data ? json.data : json;
        if (data && data.success) {
          localStorage.setItem("sanschat_user", JSON.stringify(data.user || { username: u }));
          window.location.href = "./utama.html?user=" + encodeURIComponent(u);
        } else {
          statusEl.style.color = "#f15c6d";
          statusEl.textContent = (data && data.message) || "Username atau password salah.";
        }
      } catch (err) {
        statusEl.style.color = "#f15c6d";
        statusEl.textContent = "Gagal terhubung ke server.";
      }
    });
  </script>
</body>
</html>
