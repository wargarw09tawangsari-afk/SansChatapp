  </div>

  <div class="form-group">
    <label class="form-label">KODE AKSES / PASSWORD</label>
    <input type="password" id="passwordInput" class="form-input" placeholder="Masukkan password warga..." onkeypress="handleKey(event)">
  </div>

  <button class="btn-login" onclick="processLogin()">MASUK KE SANSCHAT</button>
  <a href="https://script.google.com/macros/s/AKfycbxCGcMURVNNwUjwS78xD4k7_RYNdG5Thp76AWGw0zXNMq3M4XViVBoP97hA7EI70THH/exec" target="_blank" class="help-btn">📖 BANTUAN SISTEM / LUPA PASSWORD</a>

<script>
  window.onload = function() {
    const inputUsr = document.getElementById('usernameInput');
    if (inputUsr.value.includes("?=")) {
      inputUsr.value = localStorage.getItem('sanschat_active_username') || "";
    }
  };

  function handleKey(e) {
    if (e.key === 'Enter') processLogin();
  }

  function processLogin() {
    const username = document.getElementById('usernameInput').value.trim().toUpperCase();
    const password = document.getElementById('passwordInput').value.trim();

    if (!username) {
      alert("Masukkan Username Warga terlebih dahulu!");
      return;
    }

    const userSession = {
      username: username,
      nama: username,
      alamat: "Warga RW 09 Cluster Sansivera"
    };

    try {
      localStorage.setItem('sanschat_active_username', username);
      localStorage.setItem('sanschat_user_session', JSON.stringify(userSession));
      sessionStorage.setItem('sanschat_active_username', username);
      sessionStorage.setItem('sanschat_user_session', JSON.stringify(userSession));
    } catch (e) {}

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.withSuccessHandler((res) => {
        if (res && res.success) {
          window.location.href = res.redirectUrl || ("?page=utama&user=" + username);
        } else {
          window.location.href = "?page=utama&user=" + username;
        }
      }).verifyUserLogin(username, password);
    } else {
      const targetUrl = "utama.html?user=" + encodeURIComponent(username);
      window.location.href = targetUrl;
    }
  }
</script>
