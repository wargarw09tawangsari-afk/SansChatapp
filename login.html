<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sc-SansChat - Login</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00a884">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
  body { background-color: #050b10; color: #00f2fe; padding: 8px; height: 100dvh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
  .mobile-container { background: #0d1722; border-radius: 16px; width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 20px; position: relative; border: 3px solid #00f2fe; box-shadow: 0 0 20px rgba(0, 242, 254, 0.4); }
  @media(min-width: 481px) { .mobile-container { height: calc(100dvh - 16px); border-radius: 20px; } }
  .logo-sc { width: 70px; height: 70px; margin: 0 auto 12px auto; background: linear-gradient(135deg, #00f2fe 0%, #005288 100%); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 30px; color: #050b10; border: 2px solid #79dae8; }
  .login-title { font-size: 19px; font-weight: 900; color: #fff; text-shadow: 0 0 8px #00f2fe; margin-bottom: 4px; text-align: center; }
  .login-subtitle { font-size: 10px; color: #79dae8; text-align: center; margin-bottom: 18px; text-transform: uppercase; }
  .field-group { margin-bottom: 14px; position: relative; }
  .field-group label { display: block; font-size: 10.5px; color: #00f2fe; margin-bottom: 4px; font-weight: bold; }
  .field-group input { width: 100%; padding: 11px 36px 11px 11px; background: #071017; border: 2px solid #1c3b52; border-radius: 8px; color: #fff; font-size: 13.5px; font-weight: 700; outline: none; }
  .password-toggle { position: absolute; right: 12px; top: 32px; cursor: pointer; font-size: 15px; color: #79dae8; }
  .btn-3d { width: 100%; background: linear-gradient(180deg, #00f2fe 0%, #008cb3 100%); color: #050b10; border: none; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 900; cursor: pointer; margin-top: 4px; text-transform: uppercase; box-shadow: 0 5px 0 #005d78; }
  .help-btn { position: absolute; top: 12px; right: 12px; background: linear-gradient(135deg, #00f2fe 0%, #007799 100%); color: #050b10; border: 1px solid #79dae8; padding: 5px 12px; border-radius: 20px; text-decoration: none; font-size: 10px; font-weight: 900; }
</style>
</head>
<body>
<div class="mobile-container">
  <a href="https://script.google.com/macros/s/AKfycbxCGcMURVNNwUjwS78xD4k7_RYNdG5Thp76AWGw0zXNMq3M4XViVBoP97hA7EI70THH/exec" target="_blank" class="help-btn">HELP SYSTEM</a>
  <div class="logo-sc">Sc</div>
  <div class="login-title">SANSCHAT SYSTEM</div>
  <div class="login-subtitle">Otentikasi Username Warga RT/RW</div>
  <div class="field-group">
    <label>USERNAME WARGA (Pengganti No HP)</label>
    <input type="text" id="loginUsername" placeholder="MASUKKAN USERNAME UNIK..." oninput="this.value = this.value.toUpperCase();">
  </div>
  <div class="field-group">
    <label>KODE AKSES / PASSWORD</label>
    <input type="password" id="loginPassword" placeholder="MASUKKAN PASSWORD..." onkeypress="if(event.key==='Enter') doLogin()">
    <span id="eyeIcon" class="password-toggle" onclick="togglePasswordVisibility()">👁️‍🗨️</span>
  </div>
  <button class="btn-3d" onclick="doLogin()">VERIFIKASI & MASUK</button>
</div>
<script>
  function togglePasswordVisibility() {
    const pass = document.getElementById('loginPassword');
    const eye = document.getElementById('eyeIcon');
    if (pass.type === 'password') { pass.type = 'text'; eye.innerText = '👁️'; }
    else { pass.type = 'password'; eye.innerText = '👁️‍🗨️'; }
  }
  function doLogin() {
    const u = document.getElementById('loginUsername').value.trim().toUpperCase();
    const p = document.getElementById('loginPassword').value.trim();
    if (!u || !p) { alert("Isi Username dan Password!"); return; }
    localStorage.setItem('sanschat_active_username', u);
    window.location.href = 'utama.html?user=' + encodeURIComponent(u);
  }
</script>
</body>
</html>
