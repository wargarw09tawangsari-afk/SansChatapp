<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sc-SansChat - Login</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00a884">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
  body { background-color: #050b10; color: #00f2fe; padding: 8px; height: 100dvh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
  .login-container { background: #0d1722; border-radius: 16px; width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 20px; position: relative; border: 3px solid #00f2fe; box-shadow: 0 0 20px rgba(0, 242, 254, 0.5); overflow-y: auto; }
  .logo-sc-3d-large { width: 75px; height: 75px; margin: 0 auto 15px auto; background: linear-gradient(135deg, #00f2fe 0%, #005288 100%); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 34px; color: #050b10; box-shadow: 0 6px 0 #003355; border: 2px solid #79dae8; }
  .login-title { font-size: 20px; font-weight: 900; color: #ffffff; text-shadow: 0 0 8px #00f2fe; margin-bottom: 6px; text-align: center; letter-spacing: 2px; }
  .login-subtitle { font-size: 10.5px; color: #79dae8; text-align: center; margin-bottom: 20px; text-transform: uppercase; }
  .field-group { margin-bottom: 15px; position: relative; }
  .field-group label { display: block; font-size: 11px; color: #00f2fe; margin-bottom: 4px; font-weight: bold; }
  .field-group input { width: 100%; padding: 12px 40px 12px 12px; background: #071017; border: 2px solid #1c3b52; border-radius: 8px; color: #ffffff; font-size: 14px; font-weight: 700; outline: none; }
  .password-toggle { position: absolute; right: 14px; top: 34px; cursor: pointer; font-size: 16px; color: #79dae8; }
  .btn-3d-robotic { width: 100%; background: linear-gradient(180deg, #00f2fe 0%, #008cb3 100%); color: #050b10; border: none; padding: 13px; border-radius: 10px; font-size: 15px; font-weight: 900; cursor: pointer; margin-top: 5px; text-transform: uppercase; box-shadow: 0 6px 0 #005d78; }
  .help-btn-3d { position: absolute; top: 14px; right: 14px; background: linear-gradient(135deg, #00f2fe 0%, #007799 100%); color: #050b10; border: 1px solid #79dae8; padding: 6px 14px; border-radius: 20px; text-decoration: none; font-size: 10.5px; font-weight: 900; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="login-container">
  <a id="btnHelpSystem" href="https://script.google.com/macros/s/AKfycbxCGcMURVNNwUjwS78xD4k7_RYNdG5Thp76AWGw0zXNMq3M4XViVBoP97hA7EI70THH/exec" target="_blank" class="help-btn-3d">HELP SYSTEM</a>
  <div class="logo-sc-3d-large">Sc</div>
  <div class="login-title">SANSCHAT SYSTEM</div>
  <div class="login-subtitle">Otentikasi Warga RT/RW</div>
  <div class="field-group">
    <label>USERNAME WARGA</label>
    <input type="text" id="loginUsername" placeholder="MASUKKAN USERNAME..." oninput="this.value = this.value.toUpperCase();">
  </div>
  <div class="field-group">
    <label>KODE AKSES / PASSWORD</label>
    <input type="password" id="loginPassword" placeholder="MASUKKAN PASSWORD..." onkeypress="if(event.key==='Enter') doLogin()">
    <span id="eyeIcon" class="password-toggle" onclick="togglePasswordVisibility()">👁️‍🗨️</span>
  </div>
  <button id="btnLoginSubmit" class="btn-3d-robotic" onclick="doLogin()">VERIFIKASI & MASUK</button>
</div>
<script>
  function togglePasswordVisibility() {
    const passInput = document.getElementById('loginPassword');
    const eyeIcon = document.getElementById('eyeIcon');
    if (passInput.type === 'password') { passInput.type = 'text'; eyeIcon.innerText = '👁️'; }
    else { passInput.type = 'password'; eyeIcon.innerText = '👁️‍🗨️'; }
  }
  function doLogin() {
    const u = document.getElementById('loginUsername').value.trim().toUpperCase();
    const p = document.getElementById('loginPassword').value.trim();
    if (!u || !p) { alert("Isi Username dan Password!"); return; }
    localStorage.setItem('sanschat_active_username', u);
    window.location.href = 'utama.html?user=' + encodeURIComponent(u);
  }
</script>
</body>
</html>
