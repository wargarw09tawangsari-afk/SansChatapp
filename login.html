<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Sc-SansChat</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        :root {
            --bg-dark: #0b141a;
            --panel-bg: rgba(17, 27, 33, 0.85);
            --accent-green: #00a884;
            --accent-glow: rgba(0, 168, 132, 0.4);
            --text-main: #e9edef;
            --text-muted: #8696a0;
            --border-glass: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 20%, #1f2c34 0%, var(--bg-dark) 80%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.6), 0 0 20px var(--accent-glow);
        }
        h2 { text-align: center; margin-bottom: 6px; font-size: 22px; color: #fff; }
        .subtitle { text-align: center; font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
        .input-group { margin-bottom: 16px; position: relative; }
        label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; font-weight: 600; }
        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
            text-transform: uppercase;
        }
        input#passwordInput { text-transform: none; padding-right: 45px; }
        input:focus { border-color: var(--accent-green); box-shadow: 0 0 10px var(--accent-glow); }
        .toggle-pass {
            position: absolute;
            right: 14px;
            top: 36px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00a884, #008069);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--accent-glow);
            margin-top: 10px;
        }
        .error-msg { color: #f15c6d; font-size: 13px; text-align: center; margin-top: 12px; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Otentikasi Warga</h2>
        <div class="subtitle">Masukkan Username & Password terdaftar</div>
        
        <div class="input-group">
            <label>Username / ID Warga</label>
            <input type="text" id="userInput" placeholder="Contoh: W38AE" autocomplete="off">
        </div>
        
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="passwordInput" placeholder="Masukkan password">
            <button type="button" class="toggle-pass" id="togglePassBtn" onclick="togglePassword()">👁️</button>
        </div>

        <button class="btn-login" onclick="processLogin()">Masuk SansChat</button>
        <div class="error-msg" id="errorMsg"></div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyHBqAVQ044nhszVhbKIeP2qi6Wwafu5KgfU648L6RNQSBwYPd_DXWm-TOqUwO7KVg/exec";

        function togglePassword() {
            const passInput = document.getElementById('passwordInput');
            const btn = document.getElementById('togglePassBtn');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                btn.textContent = '🙈';
            } else {
                passInput.type = 'password';
                btn.textContent = '👁️';
            }
        }

        async function processLogin() {
            const user = document.getElementById('userInput').value.trim().toUpperCase();
            const pass = document.getElementById('passwordInput').value.trim();
            const errDiv = document.getElementById('errorMsg');
            
            if (!user || !pass) {
                errDiv.textContent = "Username dan Password wajib diisi!";
                errDiv.style.display = "block";
                return;
            }

            errDiv.style.display = "none";

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'loginUserWithBundle', username: user, password: pass })
                });
                const resJson = await response.json();
                const data = resJson.data;

                if (data && data.success) {
                    localStorage.setItem('sanschat_user', JSON.stringify(data.user));
                    localStorage.setItem('sanschat_bundle', JSON.stringify(data.bundle));
                    
                    if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
                        navigator.serviceWorker.controller.postMessage({
                            type: 'SET_ACTIVE_USER',
                            username: data.user.username
                        });
                    }

                    window.location.href = `./utama.html?user=${encodeURIComponent(data.user.username)}`;
                } else {
                    errDiv.textContent = (data && data.message) ? data.message : "Login gagal, periksa kembali data Anda.";
                    errDiv.style.display = "block";
                }
            } catch (e) {
                errDiv.textContent = "Kesalahan koneksi server.";
                errDiv.style.display = "block";
            }
        }
    </script>
</body>
</html>
