<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SansChat - Selamat Datang & Login</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #06b6d4;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: var(--card-bg);
            border: 1px solid rgba(6, 182, 212, 0.2);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h1 {
            color: var(--accent);
            margin-bottom: 10px;
            font-size: 1.8rem;
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.4);
        }
        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: var(--text);
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 5px rgba(6, 182, 212, 0.3);
        }
        button {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .step {
            display: none;
        }
        .step.active {
            display: block;
        }
        .error-msg {
            color: #f87171;
            font-size: 0.85rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- STEP 1: SELAMAT DATANG -->
        <div id="stepWelcome" class="step active">
            <h1>Selamat Datang di SansChat</h1>
            <p>Portal Komunitas RW 09 Cluster Sansivera & Sistem Layanan Terpadu.</p>
            <button onclick="goToLogin()">Mulai Masuk</button>
        </div>

        <!-- STEP 2: LOGIN -->
        <div id="stepLogin" class="step">
            <h1>Login Pengguna</h1>
            <p>Masukkan nama atau ID warga Anda untuk melanjutkan.</p>
            <div class="form-group">
                <label for="loginName">Nama / ID Warga:</label>
                <input type="text" id="loginName" placeholder="Contoh: Budi / Warga 037">
            </div>
            <button onclick="handleLogin()">Masuk ke Aplikasi</button>
            <div id="loginError" class="error-msg"></div>
        </div>
    </div>

    <script>
        function goToLogin() {
            document.getElementById('stepWelcome').classList.remove('active');
            document.getElementById('stepLogin').classList.add('active');
        }

        function handleLogin() {
            const name = document.getElementById('loginName').value.trim();
            const errorDiv = document.getElementById('loginError');

            if (!name) {
                errorDiv.textContent = 'Nama atau ID tidak boleh kosong!';
                return;
            }

            // Simpan sesi user di localStorage agar terbaca di utama.html
            localStorage.setItem('sanschat_user', name);

            // Redirect ke halaman utama.html
            window.location.href = './utama.html';
        }

        // Pendaftaran Service Worker PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker terdaftar:', reg.scope))
                    .catch(err => console.error('Service Worker gagal:', err));
            });
        }
    </script>
</body>
</html>
