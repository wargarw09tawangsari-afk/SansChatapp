<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sc-SansChat - Portal Warga RW 09</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#111b21">
    <style>
        :root {
            --bg-dark: #0b141a;
            --panel-bg: rgba(17, 27, 33, 0.85);
            --accent-green: #00a884;
            --accent-glow: rgba(0, 168, 132, 0.4);
            --text-main: #e9edef;
            --text-muted: #8696a0;
            --border-glass: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 20%, #1f2c34 0%, var(--bg-dark) 80%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 20px var(--accent-glow);
            text-align: center;
        }
        .logo-box {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #00a884, #005c4b);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px var(--accent-glow);
            font-size: 40px;
        }
        h1 { font-size: 24px; margin-bottom: 8px; color: #fff; }
        p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-primary { background: linear-gradient(135deg, #00a884, #008069); color: #fff; box-shadow: 0 4px 15px var(--accent-glow); }
        .btn-secondary { background: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid var(--border-glass); }
        .footer-tag { margin-top: 20px; font-size: 12px; color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-box">🛡️</div>
        <h1>Sc-SansChat RW 09</h1>
        <p>Aplikasi Komunikasi Resmi Warga Perumahan Griya Taman Asri Cluster Sansiviera Tawangsari Sidoarjo.</p>
        
        <button class="btn btn-primary" onclick="window.location.href='./login.html'">🔑 Masuk Portal Warga</button>
        <button class="btn btn-secondary" id="installBtn" style="display:none;" onclick="installPWA()">📱 Pasang Aplikasi (PWA)</button>
        
        <div class="footer-tag">ProJack12-2026 • Secure PWA Environment</div>
    </div>

    <script>
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').style.display = 'flex';
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        document.getElementById('installBtn').style.display = 'none';
                    }
                    deferredPrompt = null;
                });
            }
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js').catch(() => {});
        }
    </script>
</body>
</html>
