<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Warga RW 09 - Index</title>
    
<style>
/* ========================================================================== */
/* ANDROID MOBILE ACCESSIBILITY & ENLARGED VIEWPORT STYLES (12px Edge Margin)  */
/* ========================================================================== */
@media screen and (max-width: 768px), (pointer: coarse) {
    html, body {
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow-x: hidden !important;
        box-sizing: border-box !important;
        font-size: 20px !important; /* Besarkan font tulisan */
        line-height: 1.6 !important;
    }

    body {
        padding: 0 12px !important; /* Pembatasan 12 px dari pinggir layar hp android */
    }

    /* Wrapper / Container adjustments for 12px margin */
    .container, .card, .main-container, .wrapper, header, footer, nav, form, .form-group {
        width: 100% !important;
        max-width: calc(100vw - 24px) !important;
        margin-left: 12px !important;
        margin-right: 12px !important;
        padding-left: 12px !important;
        padding-right: 12px !important;
        box-sizing: border-box !important;
    }

    /* Besarkan semua ukuran font dan elemen teks */
    h1 { font-size: 2.8rem !important; margin-bottom: 20px !important; }
    h2 { font-size: 2.3rem !important; margin-bottom: 18px !important; }
    h3 { font-size: 1.9rem !important; margin-bottom: 15px !important; }
    p, span, a, label, li, input, select, textarea, button {
        font-size: 1.25rem !important;
    }

    /* Besarkan tombol & input agar mudah disentuh di HP Android */
    button, .btn, input[type="submit"], input[type="button"], .button {
        width: 100% !important;
        padding: 18px 24px !important;
        font-size: 1.4rem !important;
        border-radius: 12px !important;
        margin: 12px 0 !important;
        min-height: 56px !important;
    }

    input[type="text"], input[type="password"], input[type="email"], input[type="number"], select, textarea {
        width: 100% !important;
        padding: 16px !important;
        font-size: 1.25rem !important;
        border-radius: 10px !important;
        margin-bottom: 15px !important;
        box-sizing: border-box !important;
    }

    /* Besarkan gambar dan icon */
    img, svg, .avatar, .icon, figure {
        max-width: 100% !important;
        height: auto !important;
        transform: scale(1.15); /* Membesarkan tampilan gambar */
        transform-origin: center;
        margin: 15px auto !important;
        display: block !important;
    }
}
</style>

</head>
<body>
    <div class="container" style="padding: 20px; text-align: center;">
        <h1>Portal Warga RW 09</h1>
        <p>Selamat datang di sistem informasi warga Sansiviera. Silakan masuk untuk melanjutkan ke menu utama.</p>
        <img src="https://images.unsplash.com/photo-1517048676732-d65bc937f952?auto=format&fit=crop&w=600&q=80" alt="Ilustrasi Warga" style="border-radius: 12px; margin: 20px 0;">
        <br>
        <a href="login.html"><button class="btn">Login ke Sistem</button></a>
    </div>
</body>
</html>
