<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Sc-SansChat - Portal Masuk</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#111b21" />
  <link rel="stylesheet" href="./single-frame.css" />
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0b141a;
      color: #e9edef;
    }
    .entry-box {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding: 20px;
      background: #111b21;
      border: 1px solid #222e35;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      border-radius: 10px;
      border: none;
      background: #00a884;
      color: #061310;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      width: 100%;
    }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #2a3942;
      background: #202c33;
      color: #e9edef;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      width: 100%;
    }
    .meta-note {
      font-size: 12px;
      color: #8696a0;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="sf-viewport-frame">
    <div class="sf-scroll-body" style="display:flex; padding: 12px;">
      <div class="entry-box">
        <div style="text-align:center;">
          <img src="./icon-192.png" alt="Sc-SansChat" width="64" height="64" style="border-radius:14px;" />
          <h1 style="margin:10px 0 4px; font-size:20px;">Sc-SansChat RW 09</h1>
          <div style="font-size:12px; color:#8696a0;">Mode 1 Frame Adaptif • Laptop, Tab &amp; Android</div>
        </div>
        <a class="btn-primary" href="./login.html">Masuk ke Portal Login</a>
        <a class="btn-secondary" href="./utama.html">Buka Halaman Utama Chat</a>
        <div class="meta-note">Semua tombol, kolom input, dan kontrol utama tetap aktif dan dapat diakses penuh di setiap ukuran layar.</div>
      </div>
    </div>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
