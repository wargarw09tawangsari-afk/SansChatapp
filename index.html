<!DOCTYPE html>

<head>

<title>Sc-SansChat - Selamat Datang</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00a884">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background-color: #050b10; color: #e9edef; padding: 8px; height: 100dvh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
  .mobile-container { background: #0d1722; width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; border-radius: 16px; border: 3px solid #00f2fe; box-shadow: 0 0 25px rgba(0, 242, 254, 0.4); }
  @media(min-width: 481px) { .mobile-container { height: 94dvh; border-radius: 24px; } }
  .welcome-title { font-size: 22px; font-weight: 900; color: #fff; text-shadow: 0 0 10px #00f2fe; margin-bottom: 16px; }
  .logo-sc { width: 80px; height: 80px; margin: 0 auto 12px auto; background: linear-gradient(135deg, #00f2fe 0%, #005288 100%); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 36px; color: #050b10; border: 2px solid #79dae8; }
  .brand-sub { font-size: 16px; font-weight: 900; color: #00f2fe; margin-bottom: 10px; }
  .welcome-email { font-size: 12px; color: #cbd5e1; margin-bottom: 18px; background: #071017; padding: 6px 14px; border-radius: 20px; border: 1px solid #1c3b52; }
  .btn-ok { width: 100%; max-width: 260px; background: linear-gradient(180deg, #00f2fe 0%, #008cb3 100%); color: #050b10; border: none; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 900; cursor: pointer; letter-spacing: 2px; text-transform: uppercase; box-shadow: 0 5px 0 #005d78; }
  .footer-tag { margin-top: 20px; font-size: 10.5px; color: #64748b; letter-spacing: 1.5px; }
</style>
</head>
<body>
<div class="mobile-container">
  <div class="welcome-title">SELAMAT DATANG</div>
  <div class="logo-sc">Sc</div>
  <div class="brand-sub">Sc-SansChat</div>
  <div class="welcome-email">wargarw09tawangsari@gmail.com</div>
  <button class="btn-ok" onclick="window.location.href='login.html'">OK</button>
  <div class="footer-tag">PROJACK12-2026 • SANSIVERA PWA</div>
</div>
</body>
