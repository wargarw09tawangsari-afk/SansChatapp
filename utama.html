<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Sc-SansChat - Utama</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#111b21" />
  <link rel="stylesheet" href="./single-frame.css" />
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0b141a;
      color: #e9edef;
    }
    .sf-sidebar {
      background: #111b21;
      border-right: 1px solid #222e35;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .sf-main {
      background: #0b141a;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .sf-header {
      flex: 0 0 auto;
      padding: 8px 12px;
      background: #202c33;
      border-bottom: 1px solid #2a3942;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .sf-badge-btn, .sf-link-btn {
      padding: 6px 9px;
      border-radius: 8px;
      border: 1px solid #2a3942;
      background: #111b21;
      color: #e9edef;
      font-size: 11.5px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .sf-link-btn[aria-disabled="true"] {
      opacity: 0.45;
      pointer-events: none;
    }
    .sf-sheet-strip {
      flex: 0 0 auto;
      padding: 6px 12px;
      background: #182229;
      border-bottom: 1px solid #222e35;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .sf-messages {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg-bubble {
      max-width: 85%;
      padding: 8px 12px;
      border-radius: 10px;
      background: #202c33;
      font-size: 13.5px;
      line-height: 1.4;
      word-break: break-word;
    }
    .msg-mine {
      align-self: flex-end;
      background: #005c4b;
    }
    .sf-composer {
      flex: 0 0 auto;
      padding: 8px 10px;
      background: #202c33;
      border-top: 1px solid #2a3942;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .sf-composer input[type="text"] {
      flex: 1 1 160px;
      min-width: 110px;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid #2a3942;
      background: #111b21;
      color: #e9edef;
      font-size: 14px;
    }
    .btn-send {
      padding: 9px 14px;
      border-radius: 10px;
      border: none;
      background: #00a884;
      color: #061310;
      font-weight: 700;
      cursor: pointer;
    }
    .room-item {
      padding: 9px 12px;
      border-bottom: 1px solid #1d282f;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .room-item.active {
      background: #2a3942;
    }
    @media (max-width: 767px) {
      .sf-sidebar {
        max-height: 24dvh;
        border-right: none;
        border-bottom: 1px solid #222e35;
      }
    }
  </style>
</head>
<body>
  <div class="sf-desktop-shell">
    <aside class="sf-sidebar">
      <div class="sf-header">
        <div style="min-width:0;">
          <div id="activeUserLabel" style="font-weight:700; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">WARGA RW 09</div>
          <div id="activeRoleLabel" style="font-size:11px; color:#8696a0;">Mode 1 Frame Adaptif</div>
        </div>
        <div class="sf-action-bar" style="width:auto;">
          <button type="button" id="togglePrivateBtn" class="sf-badge-btn">Chat Privat</button>
          <a href="./login.html" class="sf-badge-btn">Akun</a>
        </div>
      </div>
      <div id="roomList" class="sf-scroll-body"></div>
    </aside>

    <main class="sf-main">
      <header class="sf-header">
        <div style="min-width:0;">
          <div id="currentRoomTitle" style="font-weight:700; font-size:13.5px;">Grup Umum</div>
          <div id="currentRoomSub" style="font-size:11px; color:#8696a0;">Siap mengirim pesan &amp; lampiran</div>
        </div>
        <div class="sf-action-bar" style="width:auto;">
          <button type="button" id="voiceCallBtn" class="sf-badge-btn">📞 Telpon</button>
          <button type="button" id="videoCallBtn" class="sf-badge-btn">🎥 Video</button>
          <button type="button" id="refreshBtn" class="sf-badge-btn">🔄 Refresh</button>
        </div>
      </header>

      <div class="sf-sheet-strip" id="spreadsheetLinksBar">
        <a id="utamaHelpLink" href="#" target="_blank" rel="noopener" class="sf-link-btn" aria-disabled="true">🆘 Help System (S1)</a>
        <a id="utamaPortalLink" href="#" target="_blank" rel="noopener" class="sf-link-btn" aria-disabled="true">🌐 Portal Web (S2)</a>
        <a id="utamaSansChatLink" href="#" target="_blank" rel="noopener" class="sf-link-btn" aria-disabled="true">💬 SansChat Link (S3)</a>
        <span id="dynamicGroupLinks" style="display:inline-flex; flex-wrap:wrap; gap:6px;"></span>
      </div>

      <div id="messagesContainer" class="sf-messages"></div>

      <form id="chatComposer" class="sf-composer">
        <input type="file" id="attachmentInput" accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt" style="display:none;" />
        <button type="button" id="attachBtn" class="sf-badge-btn" title="Lampirkan file atau foto">📎 File</button>
        <input type="text" id="messageInput" placeholder="Ketik pesan..." autocomplete="off" />
        <button type="submit" id="sendBtn" class="btn-send">Kirim</button>
      </form>
    </main>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyHBqAVQ044nhszVhbKIeP2qi6Wwafu5KgfU648L6RNQSBwYPd_DXWm-TOqUwO7KVg/exec";
    const urlParams = new URLSearchParams(window.location.search);
    const savedUser = (() => {
      try { return JSON.parse(localStorage.getItem("sanschat_user") || "null"); } catch (e) { return null; }
    })();
    const activeUsername = (urlParams.get("user") || (savedUser && savedUser.username) || "ADMINPUSAT").toUpperCase();
    const activeNama = (savedUser && savedUser.nama) || activeUsername;

    let isPrivateMode = urlParams.get("openPrivate") === "1";
    let currentGroup = { name: "Grup Umum", sheetName: "ChatUmum", link: "" };
    let pendingAttachment = null;

    document.getElementById("activeUserLabel").textContent = `${activeNama} (${activeUsername})`;
    if (savedUser && savedUser.role) {
      document.getElementById("activeRoleLabel").textContent = `Role: ${savedUser.role} • 1 Frame`;
    }

    function activateAnchorLink(el, url) {
      if (!el) return;
      const clean = String(url || "").trim();
      if (clean && /^https?:\/\//i.test(clean)) {
        el.href = clean;
        el.setAttribute("aria-disabled", "false");
        el.style.opacity = "1";
        el.style.pointerEvents = "auto";
      }
    }

    function renderSpreadsheetLinks(cfg, groups) {
      if (cfg) {
        activateAnchorLink(document.getElementById("utamaHelpLink"), cfg.helpSystemUrl);
        activateAnchorLink(document.getElementById("utamaPortalLink"), cfg.portalWebUrl);
        activateAnchorLink(document.getElementById("utamaSansChatLink"), cfg.sansChatUrl);
      }
      const dynBox = document.getElementById("dynamicGroupLinks");
      dynBox.innerHTML = "";
      if (Array.isArray(groups)) {
        groups.forEach((g) => {
          if (g && g.link && /^https?:\/\//i.test(String(g.link).trim())) {
            const a = document.createElement("a");
            a.className = "sf-link-btn";
            a.href = String(g.link).trim();
            a.target = "_blank";
            a.rel = "noopener";
            a.textContent = `🔗 ${g.name}`;
            dynBox.appendChild(a);
          }
        });
      }
    }

    async function postApi(payload) {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      return (json && json.data !== undefined) ? json.data : json;
    }

    function renderRooms(groups) {
      const listEl = document.getElementById("roomList");
      listEl.innerHTML = "";
      const items = (Array.isArray(groups) && groups.length) ? groups : [{ name: "Grup Umum", sheetName: "ChatUmum", link: "" }];
      items.forEach((g) => {
        const div = document.createElement("div");
        div.className = "room-item" + (!isPrivateMode && g.sheetName === currentGroup.sheetName ? " active" : "");
        div.innerHTML = `<div style="font-weight:600; font-size:13px;">${g.name}</div><div style="font-size:11px; color:#8696a0;">${g.lastMessage || "Buka ruang obrolan"}</div>`;
        div.onclick = () => {
          isPrivateMode = false;
          currentGroup = g;
          document.getElementById("currentRoomTitle").textContent = g.name;
          renderRooms(items);
          loadMessages();
        };
        listEl.appendChild(div);
      });
    }

    function renderMessages(msgs) {
      const box = document.getElementById("messagesContainer");
      box.innerHTML = "";
      if (!Array.isArray(msgs) || !msgs.length) {
        box.innerHTML = `<div style="text-align:center; color:#8696a0; font-size:12px; margin-top:20px;">Belum ada pesan di ruang ini.</div>`;
        return;
      }
      msgs.forEach((m) => {
        const sender = (m.senderUsername || m.pengirimUsername || "").toUpperCase();
        const text = m.pesan || m.pesanD || "";
        const media = m.mediaUrl || m.pesanF || "";
        const bubble = document.createElement("div");
        bubble.className = "msg-bubble" + (sender === activeUsername ? " msg-mine" : "");
        let html = `<div style="font-size:11px; color:#8696a0; margin-bottom:2px;">${m.senderNama || m.nama || sender}</div>`;
        if (text) html += `<div>${text}</div>`;
        if (media) {
          if (media.startsWith("data:image/") || media.includes("googleusercontent.com/d/")) {
            html += `<img src="${media}" alt="Lampiran" style="max-width:220px; border-radius:8px; margin-top:6px; display:block;" />`;
          } else {
            html += `<a href="${media}" target="_blank" rel="noopener" style="color:#53bdeb; font-size:12px; display:inline-block; margin-top:6px;">Buka Lampiran</a>`;
          }
        }
        bubble.innerHTML = html;
        box.appendChild(bubble);
      });
      box.scrollTop = box.scrollHeight;
    }

    async function loadDashboard() {
      try {
        const cachedCfg = (() => {
          try { return JSON.parse(localStorage.getItem("sanschat_sheet_config") || "null"); } catch (_) { return null; }
        })();
        if (cachedCfg) renderSpreadsheetLinks(cachedCfg, []);

        const cfgRes = await fetch(API_URL + "?action=getConfig").then(r => r.json()).catch(() => null);
        const cfg = (cfgRes && cfgRes.config) ? cfgRes.config : (cfgRes && cfgRes.data && cfgRes.data.config ? cfgRes.data.config : cachedCfg);
        if (cfg) localStorage.setItem("sanschat_sheet_config", JSON.stringify(cfg));

        const bundle = await postApi({ action: "getInitialDashboardBundle", username: activeUsername });
        const groups = (bundle && bundle.groups) ? bundle.groups : [];
        if (groups.length) renderRooms(groups);
        renderSpreadsheetLinks(cfg, groups);
        await loadMessages();
      } catch (e) {}
    }

    async function loadMessages() {
      try {
        if (isPrivateMode) {
          document.getElementById("currentRoomTitle").textContent = "Chat Privat";
          const priv = await postApi({ action: "getPrivateChatSheetRecords", username: activeUsername });
          renderMessages(priv);
        } else {
          const msgs = await postApi({
            action: "getMessages",
            chatSheetName: currentGroup.sheetName,
            username: activeUsername,
            groupName: currentGroup.name
          });
          renderMessages(msgs);
        }
      } catch (e) {}
    }

    document.getElementById("attachBtn").addEventListener("click", () => {
      document.getElementById("attachmentInput").click();
    });

    document.getElementById("attachmentInput").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        pendingAttachment = {
          fileName: file.name,
          mimeType: file.type || "application/octet-stream",
          base64Data: reader.result
        };
        document.getElementById("currentRoomSub").textContent = `Lampiran siap: ${file.name}`;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById("chatComposer").addEventListener("submit", async (e) => {
      e.preventDefault();
      const inputEl = document.getElementById("messageInput");
      const text = inputEl.value.trim();
      if (!text && !pendingAttachment) return;

      const tipe = pendingAttachment
        ? (pendingAttachment.mimeType.startsWith("image/") ? "image" : (pendingAttachment.mimeType.startsWith("video/") ? "video" : "file"))
        : "text";
      const mediaUrl = pendingAttachment ? pendingAttachment.base64Data : "";
      const fileName = pendingAttachment ? pendingAttachment.fileName : "";

      inputEl.value = "";
      pendingAttachment = null;
      document.getElementById("currentRoomSub").textContent = "Mengirim...";

      try {
        if (isPrivateMode) {
          await postApi({
            action: "sendPrivateMessage",
            username: activeUsername,
            nama: activeNama,
            pesan: text || fileName,
            tipe: tipe,
            mediaUrl: mediaUrl,
            targetUsername: activeUsername,
            fileName: fileName
          });
        } else {
          await postApi({
            action: "sendMessage",
            chatSheetName: currentGroup.sheetName,
            username: activeUsername,
            nama: activeNama,
            pesan: text || fileName,
            tipe: tipe,
            mediaUrl: mediaUrl,
            groupName: currentGroup.name,
            fileName: fileName
          });
        }
        document.getElementById("currentRoomSub").textContent = "Terkirim";
        await loadMessages();
      } catch (err) {
        document.getElementById("currentRoomSub").textContent = "Gagal mengirim";
      }
    });

    document.getElementById("togglePrivateBtn").addEventListener("click", () => {
      isPrivateMode = !isPrivateMode;
      document.getElementById("togglePrivateBtn").textContent = isPrivateMode ? "Grup Warga" : "Chat Privat";
      loadMessages();
    });

    document.getElementById("refreshBtn").addEventListener("click", loadDashboard);

    document.getElementById("voiceCallBtn").addEventListener("click", async () => {
      await postApi({ action: "initiateCall", targetUsername: "ALL", callerUsername: activeUsername, callerName: activeNama, type: "voice" });
      alert("Panggilan suara diinisiasi.");
    });

    document.getElementById("videoCallBtn").addEventListener("click", async () => {
      await postApi({ action: "initiateCall", targetUsername: "ALL", callerUsername: activeUsername, callerName: activeNama, type: "video" });
      alert("Panggilan video diinisiasi.");
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js').then((reg) => {
        if (reg.active) {
          reg.active.postMessage({ type: 'SET_ACTIVE_USER', username: activeUsername });
        }
      }).catch(() => {});
    }

    loadDashboard();
  </script>
</body>
</html>
