<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SansChat - Halaman Utama</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #06b6d4;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: var(--card-bg);
            border: 1px solid rgba(6, 182, 212, 0.2);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
        }
        h2 {
            color: var(--accent);
            margin: 0;
            font-size: 1.3rem;
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.4);
        }
        .logout-btn {
            background: transparent;
            color: #f87171;
            border: 1px solid #f87171;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .logout-btn:hover {
            background: #f87171;
            color: #0f172a;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        textarea, input[type="file"] {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: var(--text);
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 5px rgba(6, 182, 212, 0.3);
        }
        button.action-btn {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }
        button.action-btn:hover {
            opacity: 0.9;
        }
        #fileContentPreview {
            margin-top: 10px;
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.85rem;
            max-height: 150px;
            overflow-y: auto;
            border: 1px dashed #334155;
            display: none;
        }
        .status {
            margin-top: 15px;
            text-align: center;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-bar">
            <h2>Dashboard SansChat</h2>
            <button class="logout-btn" onclick="handleLogout()">Keluar</button>
        </div>
        
        <div class="form-group">
            <label id="greetingUser">Masuk sebagai: Pengguna</label>
        </div>

        <div class="form-group">
            <label for="chatMessage">Pesan / Laporan / Kendala:</label>
            <textarea id="chatMessage" rows="4" placeholder="Tulis pesan atau unggah file .txt di bawah..."></textarea>
        </div>

        <!-- FITUR UPLOAD FILE TXT & PREVIEW -->
        <div class="form-group">
            <label for="txtFileUploader">Unggah Berkas Teks (.txt):</label>
            <input type="file" id="txtFileUploader" accept=".txt">
            <div id="fileContentPreview"></div>
        </div>

        <button class="action-btn" onclick="sendDataToAppsScript()">Kirim ke Sistem</button>
        <div id="statusMessage" class="status"></div>
    </div>

    <script>
        // Konfigurasi Endpoint & Spreadsheet ID sesuai permintaan terbaru
        const CONFIG = {
            HELP_SYSTEM_URL: "https://script.google.com/macros/s/AKfycbxCGcMURVNNwUjwS78xD4k7_RYNdG5Thp76AWGw0zXNMq3M4XViVBoP97hA7EI70THH/exec",
            PORTAL_WEB_URL: "https://script.google.com/macros/s/AKfycbx0sWsVVIZftyTKwAR0YtHDzPCPGeNIrtlu5juNlK9XsKyTevpoAH1a8Jszbf6HCSiWXg/exec",
            WEBAPP_SANSCHAT_URL: "https://script.google.com/macros/s/AKfycbyHBqAVQ044nhszVhbKIeP2qi6Wwafu5KgfU648L6RNQSBwYPd_DXWm-TOqUwO7KVg/exec",
            SPREADSHEET_ID: "1kmZa08cDx5ts4Ld819mLsVmBJ83J-vZPu89i59TU3VI"
        };

        // Cek Sesi Login saat Halaman Dimuat
        const currentUser = localStorage.getItem('sanschat_user');
        if (!currentUser) {
            window.location.href = './index.html';
        } else {
            document.getElementById('greetingUser').textContent = `Masuk sebagai: ${currentUser}`;
        }

        function handleLogout() {
            localStorage.removeItem('sanschat_user');
            window.location.href = './index.html';
        }

        // Handler Upload Berkas Teks (.txt)
        document.getElementById('txtFileUploader').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const textContent = e.target.result;
                
                const previewDiv = document.getElementById('fileContentPreview');
                previewDiv.style.display = 'block';
                previewDiv.textContent = textContent;

                // Masukkan isi teks file secara otomatis ke dalam textarea pesan
                document.getElementById('chatMessage').value = textContent;
            };
            reader.readAsText(file);
        });

        // Fungsi Pengiriman Data ke Google Apps Script WebApp
        async function sendDataToAppsScript() {
            const message = document.getElementById('chatMessage').value.trim();
            const statusDiv = document.getElementById('statusMessage');

            if (!message) {
                statusDiv.style.color = '#f87171';
                statusDiv.textContent = 'Pesan tidak boleh kosong!';
                return;
            }

            statusDiv.style.color = '#06b6d4';
            statusDiv.textContent = 'Mengirim data ke server...';

            const payload = {
                sheetId: CONFIG.SPREADSHEET_ID,
                name: currentUser,
                message: message,
                timestamp: new Date().toISOString()
            };

            try {
                await fetch(CONFIG.WEBAPP_SANSCHAT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                statusDiv.style.color = '#4ade80';
                statusDiv.textContent = 'Data berhasil dikirim ke sistem!';
            } catch (error) {
                console.error('Error:', error);
                statusDiv.style.color = '#f87171';
                statusDiv.textContent = 'Gagal terhubung ke server Apps Script.';
            }
        }
    </script>
</body>
</html>
