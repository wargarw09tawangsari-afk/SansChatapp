<script>
  const DEFAULT_S2_URL = "https://script.google.com/macros/s/AKfycbx0sWsVVIZftyTKwAR0YtHDzPCPGeNIrtlu5juNlK9XsKyTevpoAH1a8Jszbf6HCSiWXg/exec";
  const DEFAULT_S3_URL = "https://script.google.com/macros/s/AKfycbyHBqAVQ044nhszVhbKIeP2qi6Wwafu5KgfU648L6RNQSBwYPd_DXWm-TOqUwO7KVg/exec";

  const RAW_INITIAL_USER = "<?= initialUsername ?>";
  const SERVER_INITIAL_USER = (RAW_INITIAL_USER && !RAW_INITIAL_USER.includes("<?")) ? RAW_INITIAL_USER : "";

  const RAW_S3_URL = "<?= s3Url ?>";
  const SERVER_S3_URL = (RAW_S3_URL && RAW_S3_URL.startsWith("http")) ? RAW_S3_URL : (localStorage.getItem('sanschat_s3_url') || DEFAULT_S3_URL);

  function callBackendApi(action, payloadObj) {
    return new Promise((resolve, reject) => {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        const args = Object.values(payloadObj || {});
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)[action](...args);
      } else {
        fetch(SERVER_S3_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(Object.assign({ action: action }, payloadObj || {}))
        })
        .then(r => r.json())
        .then(res => {
          if (res && res.status === 'ok') resolve(res.data);
          else reject(new Error((res && res.message) || 'Gagal sinkronisasi server'));
        })
        .catch(reject);
      }
    });
  }

  function resolveSavedUserSession() {
    const urlParams = new URLSearchParams(window.location.search);
    const urlUser = (urlParams.get('user') || "").trim().toUpperCase();
    const serverUser = (SERVER_INITIAL_USER || "").trim().toUpperCase();

    let storedObj = null;
    try {
      storedObj = JSON.parse(localStorage.getItem('sanschat_user_session') || sessionStorage.getItem('sanschat_user_session') || 'null');
    } catch (e) {}

    const storedUsername = (
      (storedObj && storedObj.username) ||
      localStorage.getItem('sanschat_active_username') ||
      sessionStorage.getItem('sanschat_active_username') ||
      ""
    ).trim().toUpperCase();

    const resolvedUsername = serverUser || urlUser || storedUsername;
    if (!resolvedUsername) return null;

    if (storedObj && storedObj.username && storedObj.username.toUpperCase() === resolvedUsername) {
      return storedObj;
    }

    const freshSession = { username: resolvedUsername, nama: resolvedUsername, alamat: "Memuat profil..." };
    try {
      localStorage.setItem('sanschat_active_username', resolvedUsername);
      localStorage.setItem('sanschat_user_session', JSON.stringify(freshSession));
      sessionStorage.setItem('sanschat_active_username', resolvedUsername);
      sessionStorage.setItem('sanschat_user_session', JSON.stringify(freshSession));
    } catch (e) {}
    return freshSession;
  }

  let currentUser = resolveSavedUserSession();
  let activeChatSheet = "";
  let activeGroupName = "";
  let isPrivateChatMode = false;
  let privateTargetUsername = "";
  let uploadTargetType = "user";
  let activeReplyQuote = "";
  let announcements = [];
  let announcementIndex = 0;
  let announcementTimer = null;
  let audioContext = null;
  let ringtoneInterval = null;
  let currentCallType = "voice";
  let activeCallRoomUrl = "";
  let activeIncomingCaller = "";
  let lastKnownMessageCount = {};
  let activeRoomPollingTimer = null;

  const announcementThemes = [
    { bg: "#142731", border: "#00f2fe", text: "#e9edef", icon: "#00f2fe" },
    { bg: "#241934", border: "#c084fc", text: "#f3e8ff", icon: "#c084fc" },
    { bg: "#132a22", border: "#34d399", text: "#ecfdf5", icon: "#34d399" },
    { bg: "#2d2113", border: "#fbbf24", text: "#fef3c7", icon: "#fbbf24" },
    { bg: "#2e1622", border: "#fb7185", text: "#ffe4e6", icon: "#fb7185" }
  ];

  const chatTextColors = [
    "#075e54", "#128c7e", "#005c4b", "#1e3a8a", "#4b0082",
    "#9a3412", "#991b1b", "#065f46", "#854d0e", "#1d4ed8"
  ];

  window.onload = function() {
    if (!currentUser || !currentUser.username) {
      redirectToIndexWelcome();
      return;
    }

    if ("Notification" in window && Notification.permission === "default") {
      Notification.requestPermission().catch(() => {});
    }

    renderCachedDashboard();
    buildEmojiPicker();
    monitorNetworkStatus();
    syncInitialDashboardBundle();

    setInterval(backgroundSyncWatcher, 6000);

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.room-header-right')) {
        document.getElementById('comboCallDropdown').classList.add('hidden');
      }
      if (!e.target.closest('#chatInputWrapper')) {
        document.getElementById('emojiPickerPanel').classList.add('hidden');
        document.getElementById('waAttachMenuPanel').classList.add('hidden');
      }
    });
  };

  function monitorNetworkStatus() {
    const updateStatus = () => {
      const bar = document.getElementById('netStatusBar');
      if (navigator.onLine) {
        bar.className = "net-status-bar";
        bar.innerText = "● Terhubung • Akun: " + currentUser.username;
      } else {
        bar.className = "net-status-bar net-offline";
        bar.innerText = "⚠ Mode Offline (Riwayat Chat Aktif) • Akun: " + currentUser.username;
      }
    };
    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);
    updateStatus();
  }

  function redirectToIndexWelcome() {
    if (window.location.hostname.includes('github.io')) {
      window.location.href = 'login.html';
      return;
    }
    const base = SERVER_S3_URL.split('?')[0];
    try {
      window.top.location.href = base + "?page=login";
    } catch (e) {
      window.location.href = base + "?page=login";
    }
  }

  function renderCachedDashboard() {
    document.getElementById('headerUserName').innerText = currentUser.nama || currentUser.username;
    document.getElementById('headerUserAddress').innerText = currentUser.alamat || "-";
    if (currentUser.foto) {
      document.getElementById('mainHeaderAvatar').innerHTML = `<img src="${currentUser.foto}" />`;
    }

    const cachedGroups = JSON.parse(localStorage.getItem('sanschat_groups_' + currentUser.username) || 'null');
    if (cachedGroups) {
      renderChatRoomList(cachedGroups);
    } else {
      document.getElementById('chatListContainer').innerHTML =
        '<div style="padding:20px; color:#00f2fe; text-align:center; font-size:13px;">Memuat grup sesuai Role (' + currentUser.username + ')...</div>';
    }

    const cachedAnn = JSON.parse(localStorage.getItem('sanschat_announcements') || 'null');
    if (cachedAnn && cachedAnn.length > 0) {
      announcements = cachedAnn;
      announcementIndex = 0;
      playNextAnnouncementCell(false);
    }
  }

  function syncInitialDashboardBundle() {
    callBackendApi('getInitialDashboardBundle', { username: currentUser.username }).then((bundle) => {
      if (!bundle) return;
      if (bundle.profile) {
        currentUser = Object.assign({}, currentUser, bundle.profile);
        try {
          localStorage.setItem('sanschat_active_username', currentUser.username);
          localStorage.setItem('sanschat_user_session', JSON.stringify(currentUser));
          sessionStorage.setItem('sanschat_active_username', currentUser.username);
          sessionStorage.setItem('sanschat_user_session', JSON.stringify(currentUser));
        } catch (e) {}

        document.getElementById('headerUserName').innerText = currentUser.nama || currentUser.username;
        document.getElementById('headerUserAddress').innerText = currentUser.alamat || "-";
        if (currentUser.foto) {
          document.getElementById('mainHeaderAvatar').innerHTML = `<img src="${currentUser.foto}" />`;
        }
      }
      if (bundle.groups) {
        localStorage.setItem('sanschat_groups_' + currentUser.username, JSON.stringify(bundle.groups));
        renderChatRoomList(bundle.groups);
      }
      if (bundle.announcements && bundle.announcements.length > 0) {
        announcements = bundle.announcements;
        localStorage.setItem('sanschat_announcements', JSON.stringify(announcements));
        announcementIndex = 0;
        playNextAnnouncementCell(false);
      }
      updatePrivateButtonBadge(bundle.hasUnreadPrivate);
      if (bundle.incomingCall) {
        startIncomingCallUI(bundle.incomingCall);
      }
    }).catch(() => {});
  }

  function backgroundSyncWatcher() {
    if (!currentUser || !currentUser.username || !navigator.onLine) return;

    callBackendApi('checkIncomingCall', { username: currentUser.username }).then((incoming) => {
      if (incoming) startIncomingCallUI(incoming);
    }).catch(() => {});

    callBackendApi('hasUnreadPrivateMessages', { username: currentUser.username }).then((hasUnread) => {
      updatePrivateButtonBadge(hasUnread);
      if (hasUnread && !isPrivateChatMode) {
        triggerBackgroundAlert("Pesan Privat Baru di Sc-SansChat", "Ada pesan privat masuk untuk " + currentUser.username);
      }
    }).catch(() => {});
  }

  function triggerBackgroundAlert(title, body) {
    playNotificationBeep();
    if (navigator.vibrate) navigator.vibrate([250, 120, 250]);
    if ("Notification" in window && Notification.permission === "granted" && document.hidden) {
      try {
        new Notification(title, {
          body: body,
          icon: "https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
        });
      } catch (e) {}
    }
  }

  function playNotificationBeep() {
    try {
      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(660, audioContext.currentTime);
      gain.gain.setValueAtTime(0.08, audioContext.currentTime);
      osc.connect(gain);
      gain.connect(audioContext.destination);
      osc.start();
      osc.stop(audioContext.currentTime + 0.18);
    } catch (e) {}
  }

  function performLogout() {
    document.getElementById('logoutWarningModal').classList.remove('hidden');
  }

  function closeLogoutModal() {
    document.getElementById('logoutWarningModal').classList.add('hidden');
  }

  function confirmLogout() {
    document.getElementById('logoutWarningModal').classList.add('hidden');
    try {
      localStorage.removeItem('sanschat_user_session');
      localStorage.removeItem('sanschat_active_username');
      sessionStorage.removeItem('sanschat_user_session');
      sessionStorage.removeItem('sanschat_active_username');
    } catch (e) {}
    currentUser = null;
    redirectToIndexWelcome();
  }

  function openWebApsUrl() {
    const targetUrl = (currentUser.webAppsUrl && currentUser.webAppsUrl.startsWith("http")) ? currentUser.webAppsUrl : DEFAULT_S2_URL;
    window.open(targetUrl, "_blank");
  }

  function triggerProfileUpload(target) {
    uploadTargetType = target;
    document.getElementById('profilePicInput').click();
  }

  function uploadProfilePicture(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(event) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        canvas.width = 180; canvas.height = 180;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, 180, 180);
        const resized = canvas.toDataURL('image/jpeg', 0.78);

        if (uploadTargetType === 'user') {
          callBackendApi('updateProfilePicture', { username: currentUser.username, base64Data: resized }).then((res) => {
            if (res && res.success) {
              currentUser.foto = resized;
              localStorage.setItem('sanschat_user_session', JSON.stringify(currentUser));
              document.getElementById('mainHeaderAvatar').innerHTML = `<img src="${resized}" />`;
            }
          });
        } else {
          document.getElementById('roomGroupAvatar').innerHTML = `<img src="${resized}" />`;
          callBackendApi('updateGroupProfilePicture', { sheetName: activeChatSheet, base64Data: resized });
        }
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  }

  function playNextAnnouncementCell(animate = true) {
    if (!announcements || announcements.length === 0) return;
    const currentText = announcements[announcementIndex];
    const theme = announcementThemes[announcementIndex % announcementThemes.length];
    const card = document.getElementById('announcementCard');
    const box = document.getElementById('announcementBox');
    const icon = document.getElementById('announcementIcon');

    const applyThemeAndText = () => {
      card.style.backgroundColor = theme.bg;
      card.style.borderColor = theme.border;
      box.style.color = theme.text;
      icon.style.color = theme.icon;
      box.innerText = currentText;
    };

    if (!animate) {
      applyThemeAndText();
    } else {
      card.classList.remove('fold-up-in');
      card.classList.add('fold-up-out');
      setTimeout(() => {
        applyThemeAndText();
        card.classList.remove('fold-up-out');
        card.classList.add('fold-up-in');
      }, 400);
    }

    let displayDuration = Math.max(5000, currentText.length * 80);
    announcementIndex = (announcementIndex + 1) % announcements.length;
    if (announcementTimer) clearTimeout(announcementTimer);
    announcementTimer = setTimeout(() => playNextAnnouncementCell(true), displayDuration);
  }

  function renderChatRoomList(rooms) {
    const container = document.getElementById('chatListContainer');
    container.innerHTML = '';
    if (!rooms || rooms.length === 0) {
      container.innerHTML = '<div style="padding:16px; color:#8696a0; text-align:center;">Tidak ada grup yang sesuai dengan Role akun (' + currentUser.username + ').</div>';
      return;
    }
    rooms.forEach(r => {
      const item = document.createElement('div');
      item.className = 'chat-item';
      item.onclick = () => openChatRoom(r.sheetName, r.name, r.foto);
      const timeLabel = r.lastTime ? new Date(r.lastTime).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
      item.innerHTML = `
        <div class="avatar">${r.foto ? `<img src="${r.foto}" />` : '👥'}</div>
        <div class="chat-details">
          <div class="chat-title-row">
            <div class="chat-name">${r.name}</div>
            <div class="chat-time">${timeLabel}</div>
          </div>
          <div class="chat-last-msg">${r.lastMessage || ('Sheet Sinkron: ' + r.sheetName)}</div>
        </div>
      `;
      container.appendChild(item);
    });
  }

  function openChatRoom(sheetName, name, foto) {
    isPrivateChatMode = false;
    activeChatSheet = sheetName;
    activeGroupName = name;
    cancelReplyQuote();

    document.getElementById('roomTitle').innerText = name;
    document.getElementById('roomSub').innerText = "Grup Aktif (Riwayat Tersimpan) • Ketuk ↩️ untuk membalas";
    document.getElementById('btnGroupMembersAction').classList.remove('hidden');
    document.getElementById('btnSelectPrivateTarget').classList.add('hidden');
    closeAllInputPopups();

    document.getElementById('roomGroupAvatar').innerHTML = foto ? `<img src="${foto}" />` : '👥';
    document.getElementById('mainView').classList.add('hidden');
    document.getElementById('roomView').classList.remove('hidden');

    const cachedMsgs = JSON.parse(localStorage.getItem('sanschat_msgs_' + sheetName) || 'null');
    if (cachedMsgs) renderMessageList(cachedMsgs, false);

    loadMessages();
    startActiveRoomAutoRefresh();
  }

  function updatePrivateButtonBadge(hasUnread) {
    const btn = document.getElementById('btnChatPrivatHeader');
    if (hasUnread) {
      btn.className = "btn-chat-privat btn-privat-red";
      btn.innerHTML = `<span class="lbl-top">Chat</span><span class="lbl-bot">Privat!</span>`;
    } else {
      btn.className = "btn-chat-privat btn-privat-green";
      btn.innerHTML = `<span class="lbl-top">Chat</span><span class="lbl-bot">Privat</span>`;
    }
  }

  function openPrivateChatPage() {
    isPrivateChatMode = true;
    activeChatSheet = "ChatPrivat";
    activeGroupName = "Chat Privat";
    cancelReplyQuote();

    document.getElementById('roomTitle').innerText = "Chat Privat";
    document.getElementById('roomSub').innerText = privateTargetUsername
      ? ("Tujuan: " + privateTargetUsername)
      : ("Akun: " + currentUser.username);
    document.getElementById('roomGroupAvatar').innerHTML = '🔒';
    document.getElementById('btnGroupMembersAction').classList.add('hidden');
    document.getElementById('btnSelectPrivateTarget').classList.remove('hidden');
    closeAllInputPopups();

    document.getElementById('mainView').classList.add('hidden');
    document.getElementById('roomView').classList.remove('hidden');

    const cachedPriv = JSON.parse(localStorage.getItem('sanschat_priv_' + currentUser.username) || 'null');
    if (cachedPriv) renderPrivateMessageList(cachedPriv, false);

    loadMessages();
    startActiveRoomAutoRefresh();
  }

  function startActiveRoomAutoRefresh() {
    stopActiveRoomAutoRefresh();
    activeRoomPollingTimer = setInterval(() => {
      if (!document.getElementById('roomView').classList.contains('hidden') && navigator.onLine) {
        loadMessages(true);
      }
    }, 5000);
  }

  function stopActiveRoomAutoRefresh() {
    if (activeRoomPollingTimer) {
      clearInterval(activeRoomPollingTimer);
      activeRoomPollingTimer = null;
    }
  }

  function handleBackToMain() {
    closeAllInputPopups();
    stopActiveRoomAutoRefresh();
    if (isPrivateChatMode) {
      callBackendApi('markPrivateMessagesAsRead', { username: currentUser.username }).then(() => {
        showMainView();
      }).catch(() => showMainView());
    } else {
      showMainView();
    }
  }

  function showMainView() {
    document.getElementById('roomView').classList.add('hidden');
    document.getElementById('mainView').classList.remove('hidden');
    syncInitialDashboardBundle();
  }

  function closeAllInputPopups() {
    document.getElementById('comboCallDropdown').classList.add('hidden');
    document.getElementById('emojiPickerPanel').classList.add('hidden');
    document.getElementById('waAttachMenuPanel').classList.add('hidden');
  }

  function setReplyQuote(senderName, textSnippet) {
    const cleanText = String(textSnippet || "").substring(0, 75);
    activeReplyQuote = `${senderName}: ${cleanText}`;
    document.getElementById('replyPreviewText').innerText = activeReplyQuote;
    document.getElementById('replyPreviewBanner').classList.remove('hidden');
    document.getElementById('inputPesan').focus();
  }

  function cancelReplyQuote() {
    activeReplyQuote = "";
    document.getElementById('replyPreviewBanner').classList.add('hidden');
    document.getElementById('replyPreviewText').innerText = "";
  }

  function isImageUrl(url) {
    if (!url) return false;
    if (url.startsWith("data:image")) return true;
    return /\.(jpeg|jpg|gif|png|webp|bmp|svg)(\?.*)?$/i.test(url) ||
           url.includes("images.unsplash.com") ||
           url.includes("googleusercontent.com") ||
           url.includes("flaticon.com") ||
           url.includes("drive.google.com/uc");
  }

  function renderRichTextWithInAppLinks(rawText, mediaUrl, tipe, rowNumber) {
    let htmlOutput = "";

    if (tipe === "poll" && mediaUrl) {
      try {
        const poll = JSON.parse(mediaUrl);
        const votes = poll.votes || {};
        const totalVotes = Object.keys(votes).length;
        htmlOutput += `<div class="wa-card"><div class="wa-card-header">📊 POLLING WARGA</div><div style="font-weight:700; margin-bottom:6px;">${poll.question}</div>`;
        poll.options.forEach((opt, idx) => {
          const count = Object.values(votes).filter(v => v === idx).length;
          htmlOutput += `<button class="poll-option-btn" onclick="castPollVote(${rowNumber}, ${idx})"><span>${opt}</span><span style="color:#008069;">${count} suara</span></button>`;
        });
        htmlOutput += `<div style="font-size:10px; color:#64748b; margin-top:5px;">Total partisipasi: ${totalVotes} warga</div></div>`;
        return htmlOutput;
      } catch (e) {}
    }

    if (tipe === "event" && mediaUrl) {
      try {
        const ev = JSON.parse(mediaUrl);
        htmlOutput += `
          <div class="wa-card">
            <div class="wa-card-header">📅 UNDANGAN ACARA WARGA</div>
            <div style="font-weight:800; font-size:13.5px;">${ev.title}</div>
            <div style="margin-top:4px; color:#334155;">🗓️ ${ev.date} • ⏰ ${ev.time}</div>
            <div style="color:#334155;">📍 ${ev.location}</div>
          </div>`;
        return htmlOutput;
      } catch (e) {}
    }

    const urlRegex = /(https?:\/\/[^\s]+)/g;
    const foundUrls = rawText.match(urlRegex) || [];
    if (mediaUrl && mediaUrl.startsWith("http") && !foundUrls.includes(mediaUrl)) {
      foundUrls.push(mediaUrl);
    }

    let formattedText = rawText.replace(urlRegex, (url) => {
      const safeUrl = url.replace(/'/g, "\\'");
      return `<a href="javascript:void(0)" onclick="openInAppPreview('${safeUrl}')" style="color:#025043; text-decoration:underline; font-weight:700;">${url}</a>`;
    });

    htmlOutput += `<div>${formattedText}</div>`;

    if (mediaUrl && mediaUrl.startsWith("data:image")) {
      htmlOutput += `<img src="${mediaUrl}" class="msg-image" onclick="openInAppPreview('${mediaUrl}')" />`;
    } else if (mediaUrl && !mediaUrl.startsWith("http") && mediaUrl.startsWith("data:")) {
      htmlOutput += `<a href="javascript:void(0)" onclick="openInAppPreview('${mediaUrl}')" class="inapp-link-card">📄 Buka Lampiran Dokumen di Layar</a>`;
    }

    foundUrls.forEach(u => {
      const safeU = u.replace(/'/g, "\\'");
      if (isImageUrl(u)) {
        htmlOutput += `<img src="${u}" class="msg-image" alt="Lampiran Gambar" onclick="openInAppPreview('${safeU}')" />`;
      } else {
        htmlOutput += `<div class="inapp-link-card" onclick="openInAppPreview('${safeU}')">🌐 Buka Tautan di Halaman Ini</div>`;
      }
    });

    return htmlOutput;
  }

  function openInAppPreview(urlOrData) {
    const modal = document.getElementById('inAppPreviewModal');
    const container = document.getElementById('inAppViewerContainer');
    const title = document.getElementById('inAppPreviewTitle');

    if (isImageUrl(urlOrData)) {
      title.innerText = "PRATINJAU GAMBAR";
      container.innerHTML = `<img src="${urlOrData}" alt="Pratinjau" />`;
    } else {
      title.innerText = "PRATINJAU HALAMAN WEB";
      container.innerHTML = `<iframe src="${urlOrData}" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>`;
    }
    modal.classList.remove('hidden');
  }

  function closeInAppPreview() {
    document.getElementById('inAppViewerContainer').innerHTML = '';
    document.getElementById('inAppPreviewModal').classList.add('hidden');
  }

  function loadMessages(isSilentPoll = false) {
    if (isPrivateChatMode) {
      callBackendApi('getPrivateChatSheetRecords', { username: currentUser.username }).then((msgs) => {
        localStorage.setItem('sanschat_priv_' + currentUser.username, JSON.stringify(msgs || []));
        renderPrivateMessageList(msgs, isSilentPoll);
      }).catch(() => {});
    } else {
      callBackendApi('getMessages', { chatSheetName: activeChatSheet, username: currentUser.username }).then((msgs) => {
        localStorage.setItem('sanschat_msgs_' + activeChatSheet, JSON.stringify(msgs || []));
        renderMessageList(msgs, isSilentPoll);
      }).catch(() => {});
    }
  }

  function renderPrivateMessageList(msgs, isSilentPoll = false) {
    const area = document.getElementById('chatMessages');
    const prevCount = lastKnownMessageCount["ChatPrivat"] || 0;
    const newCount = msgs ? msgs.length : 0;

    if (isSilentPoll && newCount === prevCount) return;
    if (isSilentPoll && newCount > prevCount && prevCount > 0) {
      playNotificationBeep();
    }
    lastKnownMessageCount["ChatPrivat"] = newCount;

    area.innerHTML = '';
    if (!msgs || msgs.length === 0) {
      area.innerHTML = '<div style="text-align:center; color:#667781; margin-top:20px;">Belum ada riwayat pesan privat. Ketuk <b>👤 Tujuan</b> di kanan atas untuk memilih warga.</div>';
      return;
    }

    msgs.forEach((m) => {
      const isMe = (m.pengirimUsername || "").toUpperCase() === currentUser.username.toUpperCase();
      const div = document.createElement('div');
      div.className = `msg-bubble ${isMe ? 'msg-outgoing' : 'msg-incoming'}`;

      let pesanColD = m.pesanD || "";
      let pesanColF = m.pesanF || "";
      let combinedText = (pesanColD !== "" && pesanColF !== "")
        ? `${pesanColD} - ${pesanColF}`
        : (pesanColD !== "" ? pesanColD : pesanColF);

      const renderedBody = renderRichTextWithInAppLinks(combinedText, pesanColF, m.tipe, m.rowNumber);
      const isRead = m.statusPesan && m.statusPesan.toUpperCase() === "SUDAH";
      const tickHtml = isRead ? `<span class="tick-blue">✓✓</span>` : `<span class="tick-gray">✓</span>`;
      const quoteHtml = m.replyTo ? `<div class="quoted-reply-box">${m.replyTo}</div>` : '';
      const safeReplySender = (m.nama || m.pengirimUsername || "").replace(/'/g, "\\'");
      const safeReplyMsg = pesanColD.replace(/'/g, "\\'").replace(/"/g, '&quot;');

      div.innerHTML = `
        <div class="msg-header-row">
          <span class="msg-sender-name">${m.nama || m.pengirimUsername}</span>
          <button class="btn-reply-msg" onclick="setReplyQuote('${safeReplySender}', '${safeReplyMsg}')" title="Balas pesan">↩️</button>
        </div>
        ${quoteHtml}
        <div style="color:#111b21; font-weight:500;">${renderedBody}</div>
        <div class="msg-meta">
          <span>${m.timestamp ? new Date(m.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : ''}</span>
          ${tickHtml}
        </div>
      `;
      area.appendChild(div);
    });

  }

  function renderMessageList(msgs, isSilentPoll = false) {
    const area = document.getElementById('chatMessages');
    const prevCount = lastKnownMessageCount[activeChatSheet] || 0;
    const newCount = msgs ? msgs.length : 0;

    if (isSilentPoll && newCount === prevCount) return;
    if (isSilentPoll && newCount > prevCount && prevCount > 0) {
      playNotificationBeep();
    }
    lastKnownMessageCount[activeChatSheet] = newCount;

    area.innerHTML = '';
    if (!msgs || msgs.length === 0) {
      area.innerHTML = '<div style="text-align:center; color:#667781; margin-top:20px;">Belum ada riwayat pesan di grup ini.</div>';
      return;
    }

    msgs.forEach((m, index) => {
      const isMe = m.senderUsername.toUpperCase() === currentUser.username.toUpperCase();
      const div = document.createElement('div');
      div.className = `msg-bubble ${isMe ? 'msg-outgoing' : 'msg-incoming'}`;

      const renderedBody = renderRichTextWithInAppLinks(m.pesan, m.mediaUrl, m.tipe, m.rowNumber);
      const quoteHtml = m.replyTo ? `<div class="quoted-reply-box">${m.replyTo}</div>` : '';
      const tickHtml = (m.readCount && m.readCount > 1)
        ? `<span class="tick-blue">✓✓</span>`
        : `<span class="tick-gray">✓</span>`;
      const dynamicColor = chatTextColors[index % chatTextColors.length];
      const safeReplySender = (m.senderNama || m.senderUsername || "").replace(/'/g, "\\'");
      const safeReplyMsg = (m.pesan || "").replace(/'/g, "\\'").replace(/"/g, '&quot;');

      div.innerHTML = `
        <div class="msg-header-row">
          <span class="msg-sender-name" style="color:${dynamicColor};">${m.senderNama || m.senderUsername}</span>
          <button class="btn-reply-msg" onclick="setReplyQuote('${safeReplySender}', '${safeReplyMsg}')" title="Balas pesan">↩️</button>
        </div>
        ${quoteHtml}
        <div style="color:#111b21; font-weight:500;">${renderedBody}</div>
        <div class="msg-meta">
          <span>${m.timestamp ? new Date(m.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : ''}</span>
          ${isMe ? tickHtml : ''}
        </div>
      `;
      area.appendChild(div);
    });
    area.scrollTop = area.scrollHeight;
  }

    } else {

        pesan: pesanText,

  function submitWhatsAppAiImage() {
    const prompt = document.getElementById('aiImagePrompt').value.trim();
    const theme = document.getElementById('aiImageTheme').value;
    if (!prompt) {
      alert("Masukkan teks atau deskripsi poster AI!");
      return;
    }

    const canvas = document.createElement('canvas');
    canvas.width = 600;
    canvas.height = 360;
    const ctx = canvas.getContext('2d');

    const grad = ctx.createLinearGradient(0, 0, 600, 360);
    if (theme === 'emerald') {
      grad.addColorStop(0, '#064e3b'); grad.addColorStop(1, '#10b981');
    } else if (theme === 'gold') {
      grad.addColorStop(0, '#78350f'); grad.addColorStop(1, '#f59e0b');
    } else {
      grad.addColorStop(0, '#0f172a'); grad.addColorStop(1, '#0284c7');
    }
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 600, 360);

    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 4;
    ctx.strokeRect(18, 18, 564, 324);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 18px sans-serif';
    ctx.fillText('✨ SANSCHAT AI VISUAL POSTER', 40, 58);

    ctx.font = 'bold 26px sans-serif';
    const words = prompt.split(' ');
    let line = '', y = 135;
    for (let n = 0; n < words.length; n++) {
      const testLine = line + words[n] + ' ';
      if (ctx.measureText(testLine).width > 510 && n > 0) {
        ctx.fillText(line, 40, y);
        line = words[n] + ' ';
        y += 36;
      } else {
        line = testLine;
      }
    }
    ctx.fillText(line, 40, y);

    ctx.font = '14px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillText(`Dibuat oleh: ${currentUser.nama} • ${activeGroupName}`, 40, 315);

    const dataUrl = canvas.toDataURL('image/png');
    closeWaModal('waAiImageModal');
    dispatchChatPayload("✨ Gambar AI: " + prompt, "image", dataUrl);
  }

  function playRingtone() {
    stopRingtone();
    const toneType = localStorage.getItem('sanschat_ringtone') || 'standard';
    const freqMap = { standard: 480, classic: 620, soft: 392 };
    const freq = freqMap[toneType] || 480;

    if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();

    ringtoneInterval = setInterval(() => {
      if (!audioContext) return;
      if (navigator.vibrate) navigator.vibrate([400, 200, 400]);
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = toneType === 'classic' ? 'square' : 'sine';
      osc.frequency.setValueAtTime(freq, audioContext.currentTime);
      gain.gain.setValueAtTime(0.12, audioContext.currentTime);
      osc.connect(gain);
      gain.connect(audioContext.destination);
      osc.start();
      osc.stop(audioContext.currentTime + 0.75);
    }, 1800);
  }

  function stopRingtone() {
    if (ringtoneInterval) {
      clearInterval(ringtoneInterval);
      ringtoneInterval = null;
    }
  }
